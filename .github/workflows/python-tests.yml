name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install package and test dependencies
        run: |
          make setup
          make install PYTHON=./.venv/bin/python
      - name: Run aggregate validation
        run: make check PYTHON=./.venv/bin/python
      - name: Inspect cleanup plan without changing files
        run: make clean-dry-run PYTHON=./.venv/bin/python
