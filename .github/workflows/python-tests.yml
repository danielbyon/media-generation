name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.14.4"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14.4"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: make install
      - name: Run test suite
        run: make test
      - name: Check installed CLI entry point
        run: make smoke
      - name: Run aggregate validation
        run: make check
      - name: Inspect cleanup plan without changing files
        run: make clean-dry-run
      - name: Verify installed console script directly
        run: media-generation --help
